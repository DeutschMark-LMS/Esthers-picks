<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Inner Subtle Ring -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4"/>

  <!-- Main Food Cloche / Bowl Motif -->
  <g filter="url(#softShadow)" transform="translate(0, 10)">
    <!-- Food Dome (Jollof Rice / Meal) -->
    <path d="M 136 290 Q 256 160 376 290 Z" fill="url(#foodGrad)"/>
    <!-- Food Dome Highlight -->
    <path d="M 170 280 Q 256 190 342 280 Z" fill="#fde68a" opacity="0.4"/>

    <!-- Steam Waves -->
    <path d="M 210 185 Q 195 140 215 105" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <path d="M 256 175 Q 275 125 256 85" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <path d="M 302 185 Q 320 140 300 105" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

    <!-- Sparkle Stars -->
    <path d="M 380 90 Q 380 115 395 115 Q 380 115 380 140 Q 380 115 365 115 Q 380 115 380 90 Z" fill="#ffffff"/>
    <path d="M 130 135 Q 130 150 140 150 Q 130 150 130 165 Q 130 150 120 150 Q 130 150 130 135 Z" fill="#ffffff" opacity="0.85"/>

    <!-- White Serving Bowl Base -->
    <path d="M 106 280 L 406 280 C 406 280 390 380 256 380 C 122 380 106 280 106 280 Z" fill="#ffffff"/>
    
    <!-- Bowl Rim Shadow & Detail -->
    <ellipse cx="256" cy="280" rx="150" ry="16" fill="#fef3c7"/>
    <ellipse cx="256" cy="282" rx="146" ry="12" fill="#ffffff"/>

    <!-- Pedestal Base -->
    <path d="M 196 376 L 316 376 L 326 396 L 186 396 Z" fill="#f1f5f9"/>
    <rect x="180" y="394" width="152" height="8" rx="4" fill="#e2e8f0"/>
  </g>
</svg>
